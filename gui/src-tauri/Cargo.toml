[package]
name = "stm32burn-gui"
version = "0.2.0"
edition = "2021"
description = "Desktop GUI for stm32burn"

[lib]
name = "stm32burn_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
stm32burn = { path = "../.." }
